name: Sync Demo-Web html to S3

on:
  push:
    branches:
      - "main"
    paths:
      - "frontend/dist/**"
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DDPS_WEB_PUBLISH_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DDPS_WEB_PUBLISH_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: "us-west-2"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Sync with AWS S3"
        run: aws s3 sync ./frontend/dist/ s3://${{ secrets.AWS_SPOTVISTA_S3_BUCKET_NAME }} --acl public-read --delete
      - name: "Create Invalidation"
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_SPOTVISTA_CF_ID }} --paths "/*"
